; PPC Smart Meter Display — ESP32-S3 + AXS15231B QSPI panel (JC3248W535 class)
;
; Arduino_GFX keeps the panel bring-up that already works: the QSPI bus, the
; AXS15231B init and the backlight. LVGL draws on top of it and never talks to
; the bus itself — see src/display.cpp.

[env:ppc-panel]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; N16R8: 16MB flash, 8MB octal PSRAM. Adjust if your module differs.
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  ; The board enumerates over native USB-Serial/JTAG, so Serial must go there.
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  ; LVGL finds lv_conf.h on the include path rather than in its own folder,
  ; which keeps the config in this repo instead of in the library.
  -DLV_CONF_INCLUDE_SIMPLE
  -I src
  -DCORE_DEBUG_LEVEL=3

lib_deps =
  moononournation/GFX Library for Arduino @ ^1.6.0
  lvgl/lvgl @ ^9.2.0
