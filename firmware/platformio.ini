; PPC Smart Meter Display — two panels, two targets.
;
;   pio run -e panel-35 -t upload    3.5" Gugxiom/Guition, AXS15231B over QSPI
;   pio run -e panel-70 -t upload    7.0" Elecrow CrowPanel DIS08070H, RGB
;
; Only the board files for the selected target are compiled, so neither panel's
; driver can break the other's build.

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DLV_CONF_INCLUDE_SIMPLE
  -I src
  -DCORE_DEBUG_LEVEL=3
lib_deps =
  lvgl/lvgl @ ^9.2.0

; ---------------------------------------------------------------------------
; 3.5 inch — ESP32-S3-N16R8, AXS15231B panel on a QSPI bus, AXS touch on I2C.
; Arduino_GFX owns the bus; LVGL hands it finished stripes.
; ---------------------------------------------------------------------------
[env:panel-35]
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_src_filter = +<*> -<board/Panel70.cpp> -<board/TouchGT911.cpp>
build_flags =
  ${env.build_flags}
  -DPANEL_35
lib_deps =
  ${env.lib_deps}
  moononournation/GFX Library for Arduino @ ^1.6.0

; ---------------------------------------------------------------------------
; 7 inch — ESP32-S3-WROOM-1-N4R8 (4MB flash, 8MB octal PSRAM), 16-bit RGB
; panel driven by the LCD_CAM peripheral, GT911 touch on I2C.
;
; Three settings here exist to stop the RGB DMA starving, which is what the
; left-edge stripes are. See README "Tuning the 7 inch panel".
;   - OPI PSRAM at 80MHz: the framebuffer lives there and is read continuously.
;   - huge_app: 4MB of flash with LVGL and fonts leaves no room for two OTA
;     slots. One app slot, no OTA.
;   - The data cache is widened so framebuffer reads miss less often.
; ---------------------------------------------------------------------------
[env:panel-70]
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
build_src_filter = +<*> -<board/Panel35.cpp> -<board/TouchAXS.cpp>
build_flags =
  ${env.build_flags}
  -DPANEL_70
  -DCONFIG_SPIRAM_SPEED_80M=1
  -DCONFIG_SPIRAM_MODE_OCT=1
  -DCONFIG_ESP32S3_DATA_CACHE_64KB=1
  -DCONFIG_ESP32S3_DATA_CACHE_LINE_64B=1
